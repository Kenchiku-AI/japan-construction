name: Prod - Deploy Form Sandbox

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_SANDBOX_IMAGE: ${{ secrets.VERCEL_SANDBOX_IMAGE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Vercel configuration
        run: |
          set -e

          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured."
            exit 1
          fi

          if [ -z "$VERCEL_TEAM_ID" ]; then
            echo "::error::VERCEL_TEAM_ID is not configured."
            exit 1
          fi

          if [ -z "$VERCEL_SANDBOX_IMAGE" ]; then
            echo "::error::VERCEL_SANDBOX_IMAGE is not configured."
            exit 1
          fi

          echo "Vercel configuration is present."
          echo "Sandbox image: $VERCEL_SANDBOX_IMAGE"

      - name: Test Vercel API authentication
        run: |
          set -e

          echo "Testing Vercel API authentication..."

          HTTP_CODE=$(curl -sS \
            -o /tmp/vercel-response.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            https://api.vercel.com/v2/user)

          echo "HTTP status: $HTTP_CODE"
          echo "Response:"
          cat /tmp/vercel-response.json
          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Vercel API authentication failed."
            exit 1
          fi

          echo "Vercel API authentication succeeded."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with Vercel Container Registry
        run: |
          set -e

          echo "Authenticating with Vercel Container Registry..."

          printf '%s' "$VERCEL_TOKEN" | \
            docker login vcr.vercel.com \
              --username "$VERCEL_TEAM_ID" \
              --password-stdin

          echo "Vercel Container Registry authentication succeeded."

      - name: Build sandbox image
        run: |
          set -e

          IMAGE="${VERCEL_SANDBOX_IMAGE}"

          echo "Building sandbox image:"
          echo "  $IMAGE:${GITHUB_SHA}"

          docker buildx build \
            --platform linux/amd64 \
            --file sandbox/Dockerfile \
            --tag "$IMAGE:${GITHUB_SHA}" \
            --tag "$IMAGE:dev" \
            --load \
            sandbox

      - name: Test sandbox image
        run: |
          set -e

          IMAGE="${VERCEL_SANDBOX_IMAGE}:${GITHUB_SHA}"

          echo "Running sandbox diagnostics..."

          docker run \
            --rm \
            "$IMAGE" \
            sandbox-diagnostics

      - name: Push sandbox image
        run: |
          set -e

          IMAGE="vcr.vercel.com/${VERCEL_SANDBOX_IMAGE}"

          echo "Pushing:"
          echo "  $IMAGE:${GITHUB_SHA}"
          echo "  $IMAGE:dev"

          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:dev"

      - name: Verify pushed image
        run: |
          set -e

          IMAGE="vcr.vercel.com/${VERCEL_SANDBOX_IMAGE}:${GITHUB_SHA}"

          echo "Pulling pushed image to verify registry access..."

          docker pull "$IMAGE"

          echo "Successfully verified:"
          echo "  $IMAGE"

      - name: Deployment summary
        run: |
          echo "============================================================"
          echo "Form Sandbox DEV deployment complete"
          echo "============================================================"
          echo
          echo "Image:"
          echo "  vcr.vercel.com/${VERCEL_SANDBOX_IMAGE}:${GITHUB_SHA}"
          echo
          echo "Dev tag:"
          echo "  vcr.vercel.com/${VERCEL_SANDBOX_IMAGE}:dev"
          echo
          echo "Git SHA:"
          echo "  ${GITHUB_SHA}"